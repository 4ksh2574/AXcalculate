<body>

    <section class="relative flex h-[34%] min-h-[250px] shrink-0 flex-col rounded-b-[58px] bg-[var(--color-surface)] px-7 pt-8">

          </button>
        </div>
        <div class="absolute right-5 top-7">

        </div>
      </div>
      <div class="mt-auto flex items-end justify-end pb-7">

        <div id="display" role="textbox" aria-label="Calculator input" contenteditable="false" spellcheck="false" inputmode="text" virtualkeyboardpolicy="manual" tabindex="0" class="calculator-display w-full max-w-full overflow-x-auto whitespace-nowrap pr-4 text-right text-[clamp(34px,14vw,58px)] font-light leading-none tracking-[-.06em]">0</div>
      </div>

    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>
    <aside id="sidebar" class="sidebar" aria-hidden="true">
      <div class="flex justify-end">

      </div>
      <div class="rounded-[24px] bg-white/25 p-5">
        <p class="text-[22px] font-semibold leading-tight tracking-[-.03em]">Created by 4ksh2574</p>
      </div>
      <nav class="mt-8 space-y-2">
        <button class="sidebar-item sidebar-item-active"><span>⌁</span><span>Calculator</span></button>
        <button id="historyBtn" class="sidebar-item"><span>↺</span><span>History</span></button>
        <a id="updatesSuggester" href="mailto:4ksh2574@gmail.com" target="_self" class="sidebar-item" aria-label="Email an updates suggestion to 4ksh2574@gmail.com">
          <span>✦</span><span>Updates suggester</span>
        </a>
      </nav>
      <div class="mt-8">
        <p class="px-4 text-[11px] font-semibold uppercase tracking-[.2em] text-[var(--color-muted)]">Theme</p>
        <div id="themeSettings" class="mt-3 grid grid-cols-3 gap-2 rounded-[22px] bg-white/20 p-2" role="group" aria-label="Theme setting">
          <button type="button" data-theme="light" class="theme-option rounded-[var(--radius)] px-2 py-3 text-xs font-semibold">Light</button>
          <button type="button" data-theme="dark" class="theme-option rounded-[var(--radius)] px-2 py-3 text-xs font-semibold">Dark</button>
          <button type="button" data-theme="system" class="theme-option rounded-[var(--radius)] px-2 py-3 text-xs font-semibold">System</button>
        </div>
      </div>
      <a href="https://www.iamaksh.oneapp.dev" class="mt-auto block rounded-[28px] bg-white/25 p-5 transition hover:bg-white/40">
        <p class="text-sm font-semibold">Find me here</p>
        <p class="mt-2 text-sm leading-6 text-[var(--color-muted)]">Visit my profile and explore more of my work.</p>
        <span class="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-[var(--color-primary-contrast)]">iamaksh.oneapp.dev <span aria-hidden="true">↗</span></span>
      </a>

    <section id="historyPanel" class="history-panel" aria-hidden="true">

  <style>

      inset: 0;

      opacity: 0;

      transition: opacity .35s ease;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .backdrop-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 20;

      flex-direction: column;

    }

    .sidebar-open {
      transform: translateX(0);
    }

      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 15px;

      font-weight: 600;
    }

      z-index: 25;
      width: min(100vw, 390px);
      margin: 0 auto;
      padding: 22px 24px 28px;
      background: var(--color-bg);
      transform: translateY(105%);
      transition: transform .38s cubic-bezier(.22,1,.36,1);
      overflow-y: auto;

      opacity: 0;
      transform: translateY(105%);
      pointer-events: none;
    }

      visibility: visible;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .history-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 18px;
      border-radius: 22px;
      background: var(--color-surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
    }

    body.sidebar-is-open {
      overflow: hidden;
    }

    /* Refined type scale and liquid-glass motion */
    main {
      position: relative;
      isolation: isolate;
      animation: appIn .55s cubic-bezier(.22,1,.36,1) both;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: .28;
      background: linear-gradient(120deg, rgba(255,255,255,.32), transparent 35%, rgba(255,255,255,.12) 65%, transparent);
      transform: translateX(-100%);
      animation: glassSweep 1.35s ease-out .2s both;
    }

    section:first-child {
      backdrop-filter: blur(8px);
      transition: height .3s ease, min-height .3s ease, transform .3s ease;
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 18px 40px rgba(24,34,31,.06);

      min-height: 210px;

      cursor: text;
      user-select: text;
      -webkit-user-select: text;
      caret-color: var(--color-primary-contrast);
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--color-primary) 55%, transparent);
      text-underline-offset: 5px;
    }

      -webkit-user-select: text;

      border-radius: var(--radius);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 36px;

      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 3px 7px rgba(24,34,31,.035);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: keyIn .5s cubic-bezier(.22,1,.36,1) both;
    }

    .key:nth-child(1) { animation-delay: .16s; }
    .key:nth-child(2) { animation-delay: .19s; }
    .key:nth-child(3) { animation-delay: .22s; }
    .key:nth-child(4) { animation-delay: .25s; }
    .key:nth-child(5) { animation-delay: .28s; }
    .key:nth-child(6) { animation-delay: .31s; }
    .key:nth-child(7) { animation-delay: .34s; }
    .key:nth-child(8) { animation-delay: .37s; }
    .key:nth-child(9) { animation-delay: .40s; }
    .key:nth-child(10) { animation-delay: .43s; }
    .key:nth-child(11) { animation-delay: .46s; }
    .key:nth-child(12) { animation-delay: .49s; }
    .key:nth-child(13) { animation-delay: .52s; }
    .key:nth-child(14) { animation-delay: .55s; }
    .key:nth-child(15) { animation-delay: .58s; }
    .key:nth-child(16) { animation-delay: .61s; }
    .key:nth-child(17) { animation-delay: .64s; }
    .key:nth-child(18) { animation-delay: .67s; }
    .key:nth-child(19) { animation-delay: .70s; }

    .key:active {

      box-shadow: inset 0 2px 5px rgba(24,34,31,.08);

    /* Scientific mode keeps the calculator footprint unchanged with compact pill keys. */
    #appShell.scientific-open .key {
      aspect-ratio: auto;
      height: 54px;
      border-radius: var(--radius);
      font-size: 27px;
    }

    #appShell.scientific-open > section:nth-of-type(2) {
      padding-top: 8px;
      transition: padding-top .52s cubic-bezier(.22,1,.36,1);
    }

    #appShell.scientific-open #scientific button {
      height: 38px;
      font-size: 14px;
      transition: height .52s cubic-bezier(.22,1,.36,1), font-size .52s ease;
    }

    #appShell.scientific-open .grid.grid-cols-4 {
      gap: 7px;
      transition: gap .52s cubic-bezier(.22,1,.36,1);
    }

    @keyframes appIn {
      from { opacity: 0; transform: scale(.97); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes keyIn {
      from { opacity: 0; transform: translateY(12px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }

    @keyframes glassSweep {

    #appShell > section:first-child {

    }

    [data-action="clear"] {

    }

    .theme-option {
      color: var(--color-muted);
      transition: background .2s ease, color .2s ease, transform .12s ease;
    }

    .theme-option:hover {
      background: rgba(255, 255, 255, .28);
    }

    .theme-option:active {
      transform: scale(.96);
    }

    .theme-option-active {
      background: var(--color-primary);
      color: var(--color-primary-contrast);
    }

    .scientific-panel {
      display: grid;
      overflow: hidden;
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      transform: translateY(-14px) scale(.97);

      transition: max-height .28s ease, opacity .18s ease, transform .28s ease, margin-bottom .28s ease, margin-top .28s ease;
    }

    .scientific-panel.grid {
      max-height: 120px;
      margin-top: 0;
      opacity: 1;

      border-radius: var(--radius);
      color: var(--color-text);

    }

    #scientific button:hover {

    }

    /* Stable phone viewport: keep every normal-mode keypad row visible. */
    #appShell {
      height: 100dvh;
      min-height: 0;
      max-height: 844px;
      display: flex;
      flex-direction: column;
    }

    #appShell > section:first-child {
      flex: 0 0 232px;
      height: 232px;
      min-height: 232px;
    }

    #appShell > section:nth-of-type(2) {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #appShell > section:nth-of-type(2) > .grid.grid-cols-4:last-child {

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(registration => registration.update())
          .catch(() => null);
      });
    }

    const display = document.getElementById('display'),
      expression = document.getElementById('expression');

    const themeSettings = document.getElementById('themeSettings');

    /*
     * Material You-style dynamic color integration.
     * An Android WebView can call:
     * window.applyAndroidDynamicColors({
     *   primary: '#6750A4',
     *   primaryContrast: '#FFFFFF',
     *   bg: '#FFFBFE',
     *   surface: '#F7F2FA',
     *   text: '#1C1B1F',
     *   muted: '#49454F'
     * });
     */
    function applyAndroidDynamicColors(colors = {}) {
      const root = document.documentElement;
      const target = document.body;
      const allowed = {
        primary: '--color-primary',
        primaryContrast: '--color-primary-contrast',
        bg: '--color-bg',
        surface: '--color-surface',
        text: '--color-text',
        muted: '--color-muted',
        outerBg: '--color-outer-bg'
      };

      Object.entries(allowed).forEach(([key, variable]) => {
        if (typeof colors[key] !== 'string' || !colors[key].trim()) return;
        const dynamicVariable = variable.replace('--color-', '--android-');
        root.style.setProperty(dynamicVariable, colors[key].trim());
      });

      root.dataset.dynamicColors = 'android';
      target.classList.add('android-dynamic-theme');
      localStorage.setItem('ax-dynamic-colors', JSON.stringify(colors));
    }

    function restoreDynamicColors() {
      try {
        const savedColors = JSON.parse(localStorage.getItem('ax-dynamic-colors') || 'null');
        if (savedColors) applyAndroidDynamicColors(savedColors);
      } catch {
        localStorage.removeItem('ax-dynamic-colors');
      }
    }

    window.applyAndroidDynamicColors = applyAndroidDynamicColors;
    restoreDynamicColors();

    function requestAndroidDynamicColors() {
      if (!window.AndroidDynamicColors || typeof window.AndroidDynamicColors.getColors !== 'function') return;

      try {
        const response = window.AndroidDynamicColors.getColors();
        const colors = typeof response === 'string' ? JSON.parse(response) : response;
        if (colors && typeof colors === 'object') applyAndroidDynamicColors(colors);
      } catch {
        // The calculator keeps its saved or default theme if the Android bridge is unavailable.
      }
    }

    requestAndroidDynamicColors();
    const themeOptions = document.querySelectorAll('[data-theme]');
    const savedTheme = localStorage.getItem('mint-calculator-theme') || 'system';
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

    function setTheme(theme, save = true) {
      const selectedTheme = ['light', 'dark', 'system'].includes(theme) ? theme : 'system';
      const useDark = selectedTheme === 'dark' || (selectedTheme === 'system' && systemTheme.matches);
      document.body.classList.toggle('dark-mode', useDark);
      document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
      themeOptions.forEach(option => {
        const active = option.dataset.theme === selectedTheme;
        option.classList.toggle('theme-option-active', active);
        option.setAttribute('aria-pressed', String(active));
      });
      if (save) localStorage.setItem('mint-calculator-theme', selectedTheme);
    }

    themeOptions.forEach(option => {
      option.addEventListener('click', () => setTheme(option.dataset.theme));
    });

    function followSystemTheme(event) {
      if ((localStorage.getItem('mint-calculator-theme') || 'system') === 'system') {
        setTheme(event.matches ? 'dark' : 'light', false);
        themeOptions.forEach(option => {
          option.classList.toggle('theme-option-active', option.dataset.theme === 'system');
          option.setAttribute('aria-pressed', String(option.dataset.theme === 'system'));
        });
      }
    }

    systemTheme.addEventListener('change', followSystemTheme);
    setTheme(savedTheme);
    let value = '',
      justEvaluated = false,
      degrees = true,
      inverse = false;

    let cursorPosition = 0;
    let cursorActive = false;

    function render() {
      display.textContent = value || '0';
      if (cursorActive) {
        display.classList.add('cursor-active');
        requestAnimationFrame(() => placeCursorAt(cursorPosition));
      }
    }

    function placeCursorAt(position) {
      const text = display.firstChild;
      if (!text) return;
      const safePosition = Math.max(0, Math.min(position, text.length));
      const selection = window.getSelection();
      const range = document.createRange();
      range.setStart(text, safePosition);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      display.scrollLeft = display.scrollWidth;
      const rect = range.getBoundingClientRect();
      const displayRect = display.getBoundingClientRect();
      if (rect.left < displayRect.left + 8) display.scrollLeft -= displayRect.left + 8 - rect.left;
      if (rect.right > displayRect.right - 8) display.scrollLeft += rect.right - (displayRect.right - 8);
    }

    function cursorFromPoint(clientX) {
      const text = display.firstChild;
      if (!text) return 0;
      let closest = 0;
      let distance = Infinity;
      for (let i = 0; i <= text.length; i++) {
        const range = document.createRange();
        range.setStart(text, i);
        range.collapse(true);
        const rect = range.getBoundingClientRect();
        const distanceToPoint = Math.abs(clientX - rect.left);
        if (distanceToPoint < distance) {
          distance = distanceToPoint;
          closest = i;
        }
      }
      return closest;
    }

    function activateCursor(position) {
      cursorActive = true;
      cursorPosition = Math.max(0, Math.min(position, value.length));
      display.classList.add('cursor-active');
      placeCursorAt(cursorPosition);
    }

    expression.addEventListener('input', () => {
      expression.textContent = expression.textContent.replace(/[^0-9.()+\-*/%^πe×÷− ]/g, '');
    });

    expression.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      const editedExpression = expression.textContent.trim();
      if (!editedExpression) return;
      value = editedExpression;
      expression.textContent = editedExpression;
      act('equals');
    });

    display.addEventListener('pointerdown', event => {
      event.preventDefault();
      activateCursor(cursorFromPoint(event.clientX));
      display.focus({ preventScroll: true });
    });

    display.addEventListener('click', event => {
      event.preventDefault();
      activateCursor(cursorFromPoint(event.clientX));
    });

    display.addEventListener('keydown', event => {
      event.stopPropagation();
      const navigationKeys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];

      if (navigationKeys.includes(event.key)) {
        event.preventDefault();
        cursorActive = true;
        if (event.key === 'ArrowLeft') cursorPosition = Math.max(0, cursorPosition - 1);
        if (event.key === 'ArrowRight') cursorPosition = Math.min(value.length, cursorPosition + 1);
        if (event.key === 'Home') cursorPosition = 0;
        if (event.key === 'End') cursorPosition = value.length;
        render();
        return;
      }

      if (event.key === 'Enter') {
        event.preventDefault();
        act('equals');
        return;
      }

      if (event.key === 'Backspace') {
        event.preventDefault();
        act('backspace');
        return;
      }

      if (event.key === 'Delete') {
        event.preventDefault();
        if (cursorPosition < value.length) {
          value = value.slice(0, cursorPosition) + value.slice(cursorPosition + 1);
          render();
        }
        return;
      }

      if (event.key.length === 1 && /[0-9.()+\-*/%^πe]/.test(event.key)) {
        event.preventDefault();
        if (justEvaluated && !cursorActive) {
        value = '';
        expression.textContent = '';
        expression.contentEditable = 'false';
        expression.classList.remove('expression-editable');
        display.contentEditable = 'true';
        justEvaluated = false;
      }
      const insertedValue = event.key.replace('*', '×').replace('/', '÷');
        if (cursorActive) {
          value = value.slice(0, cursorPosition) + insertedValue + value.slice(cursorPosition);
          cursorPosition += insertedValue.length;
        } else {
          value += insertedValue;
          cursorPosition = value.length;
        }
        render();
      }
    });

    function calculate(raw) {
      let exp = String(raw)
        .replaceAll('×', '*')
        .replaceAll('÷', '/')
        .replaceAll('−', '-')
        .replaceAll('π', 'Math.PI')
        .replaceAll('e', 'Math.E')
        .replaceAll('%', '/100')
        .replace(/(\d+(?:\.\d+)?)\^/g, '$1**');

      // Only allow calculator characters before evaluating the expression.
      const safeExpression = exp.replaceAll('Math.PI', '').replaceAll('Math.E', '');
      if (!/^[0-9+\-*/().\s]+$/.test(safeExpression)) throw Error('Invalid expression');
      const result = Function('"use strict"; return (' + exp + ')')();
      if (!Number.isFinite(result)) throw Error('Invalid result');
      return result;
    }

    function act(action) {
      if (action === 'clear') {
        value = '';
        expression.textContent = '';
        expression.contentEditable = 'false';
        expression.classList.remove('expression-editable');
        display.contentEditable = 'true';
        justEvaluated = false;
      }
      if (action === 'backspace') {
        if (cursorActive && cursorPosition > 0) {
          value = value.slice(0, cursorPosition - 1) + value.slice(cursorPosition);
          cursorPosition -= 1;
        } else {
          value = value.slice(0, -1);
        }
      }
      if (action === 'equals' && value) {
        try {
          const result = calculate(value);
          const completedExpression = value;
          expression.textContent = completedExpression;
          expression.contentEditable = 'true';
          expression.classList.add('expression-editable');
          value = String(Number.isInteger(result) ? result : parseFloat(result.toFixed(10)));
          addHistory(completedExpression + ' =', value);
          justEvaluated = true;
          cursorActive = false;
          cursorPosition = 0;
          display.contentEditable = 'false';
        } catch {
          display.textContent = 'Error';
          value = '';
        }
      }
      if (action === 'sqrt' && value) {
        try {
          expression.textContent = '√(' + value + ')';
          value = String(Math.sqrt(calculate(value)));
        } catch {}
      }
      if (action === 'factorial' && value) {
        let n = Math.floor(Number(value)),
          r = 1;
        for (let i = 2; i <= n; i++) r *= i;
        expression.textContent = value + '!';
        value = String(r);
      }
      if (action === 'power') value += '^';
      if (action === 'deg') {
        degrees = !degrees;
        const angleButton = document.querySelector('[data-action="deg"]');
        angleButton.textContent = degrees ? 'DEG' : 'RAD';
        angleButton.setAttribute('aria-label', degrees ? 'Use degrees' : 'Use radians');
      }
      if (action === 'inv') {
        inverse = !inverse;
        const inverseButton = document.querySelector('[data-action="inv"]');
        inverseButton.textContent = inverse ? 'INV ✓' : 'INV';
        inverseButton.classList.toggle('bg-white/40', inverse);
      }
      if (['sin', 'cos', 'tan', 'ln', 'log'].includes(action)) {
        if (!value) {
          expression.textContent = 'Enter a number first';
          render();
          return;
        }

        try {
          const input = calculate(value);
          let result;
          let label = action;
          const isTrig = ['sin', 'cos', 'tan'].includes(action);

          if (isTrig && inverse) {
            result = action === 'sin' ? Math.asin(input) : action === 'cos' ? Math.acos(input) : Math.atan(input);
            if (degrees) result *= 180 / Math.PI;
            label = 'inv ' + action;
          } else if (isTrig) {
            const radians = degrees ? input * Math.PI / 180 : input;
            result = action === 'sin' ? Math.sin(radians) : action === 'cos' ? Math.cos(radians) : Math.tan(radians);
          } else {
            result = action === 'ln' ? Math.log(input) : Math.log10(input);
          }

          if (!Number.isFinite(result)) throw Error('Invalid result');
          expression.textContent = label + '(' + value + ')';
          value = String(Number(result.toFixed(10)));
          justEvaluated = true;
          cursorActive = true;
          cursorPosition = value.length;
        } catch {
          expression.textContent = 'Invalid input';
          value = '';
        }
      }
      render();
    }
    document.querySelectorAll('[data-value]').forEach(btn => btn.onclick = () => {
      if (justEvaluated && !cursorActive) {
        value = '';
        expression.textContent = '';
        expression.contentEditable = 'false';
        expression.classList.remove('expression-editable');
        display.contentEditable = 'true';
        justEvaluated = false;
      }
      const insertedValue = btn.dataset.value;
      if (cursorActive) {
        value = value.slice(0, cursorPosition) + insertedValue + value.slice(cursorPosition);
        cursorPosition += insertedValue.length;
      } else {
        value += insertedValue;
      }
      render();
    });
    document.querySelectorAll('[data-action]').forEach(btn => btn.onclick = () => act(btn.dataset.action));
    document.getElementById('scientificBtn').onclick = () => {
      const s = document.getElementById('scientific');
      const opening = !s.classList.contains('grid');
      s.classList.toggle('grid', opening);
      s.setAttribute('aria-hidden', String(!opening));
      document.getElementById('scientificBtn').classList.toggle('mode-switching', true);
      setTimeout(() => document.getElementById('scientificBtn').classList.remove('mode-switching'), 500);
      document.getElementById('scientificBtn').textContent = opening ? '⌃' : '⌄';
      document.getElementById('modeLabel').textContent = opening ? 'Scientific mode' : 'Basic mode';
      document.getElementById('appShell').classList.toggle('scientific-open', opening);
    };
    const sidebar = document.getElementById('sidebar'),
      sidebarBackdrop = document.getElementById('sidebarBackdrop'),
      menuBtn = document.getElementById('menuBtn'),
      closeMenu = document.getElementById('closeMenu');

    function toggleSidebar(open) {
      sidebar.classList.toggle('sidebar-open', open);
      sidebarBackdrop.classList.toggle('backdrop-visible', open);
      sidebar.setAttribute('aria-hidden', String(!open));
      sidebarBackdrop.setAttribute('aria-hidden', String(!open));
      menuBtn.setAttribute('aria-expanded', String(open));
      document.body.classList.toggle('sidebar-is-open', open);
    }

    const historyPanel = document.getElementById('historyPanel'),
      historyList = document.getElementById('historyList'),
      historyBtn = document.getElementById('historyBtn'),
      closeHistory = document.getElementById('closeHistory');
    const HISTORY_STORAGE_KEY = 'ax-calculate-history';
    let history = loadHistory();

    function loadHistory() {
      try {
        const savedHistory = JSON.parse(localStorage.getItem(HISTORY_STORAGE_KEY) || '[]');
        return Array.isArray(savedHistory) ? savedHistory : [];
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
      } catch {
        // The calculator continues working if device storage is unavailable.
      }
    }

    function addHistory(calculation, result) {
      history.unshift({
        calculation,
        result,
        savedAt: new Date().toISOString()
      });
      saveHistory();
      renderHistory();
    }

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => null);
    }

    function renderHistory() {
      historyList.innerHTML = history.length ? history.map((item, index) => `
        <button type="button" class="history-entry w-full text-left transition hover:-translate-y-1 hover:shadow-lg" data-history-index="${index}" aria-label="Restore ${item.calculation}">
          <span class="truncate text-sm text-[var(--color-muted)]">${item.calculation}</span>
          <strong class="text-lg font-medium">${item.result}</strong>
        </button>`).join('') : `
        <div class="rounded-[24px] bg-[var(--color-surface)] p-5 text-sm leading-6 text-[var(--color-muted)]">
          Your completed calculations will appear here.
        </div>`;
    }

    function toggleHistory(open) {
      toggleSidebar(false);
      historyPanel.classList.toggle('history-panel-open', open);
      historyPanel.setAttribute('aria-hidden', String(!open));
    }

    historyList.addEventListener('click', event => {
      const historyEntry = event.target.closest('[data-history-index]');
      if (!historyEntry) return;

      const selectedItem = history[Number(historyEntry.dataset.historyIndex)];
      if (!selectedItem) return;

      const restoredExpression = selectedItem.calculation.replace(/\s=\s*$/, '');
      value = restoredExpression;
      expression.textContent = 'Restored from history';
      justEvaluated = false;
      cursorActive = false;
      cursorPosition = value.length;

      toggleHistory(false);
      render();
      display.classList.remove('cursor-active');
      display.animate([
        { opacity: 0, transform: 'translateY(12px) scale(.96)' },
        { opacity: 1, transform: 'translateY(0) scale(1)' }
      ], {
        duration: 420,
        easing: 'cubic-bezier(.22,1,.36,1)'
      });
      expression.animate([
        { opacity: 0, transform: 'translateY(8px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ], {
        duration: 360,
        easing: 'cubic-bezier(.22,1,.36,1)'
      });
      display.focus({ preventScroll: true });
    });

    renderHistory();
    historyPanel.classList.remove('history-panel-open');
    historyPanel.setAttribute('aria-hidden', 'true');
    toggleHistory(false);
    historyBtn.onclick = () => toggleHistory(true);
    closeHistory.onclick = () => toggleHistory(false);
    historyPanel.addEventListener('click', event => {
      if (event.target.closest('#closeHistory')) toggleHistory(false);
    });
    menuBtn.onclick = () => toggleSidebar(true);
    closeMenu.onclick = () => toggleSidebar(false);
    sidebarBackdrop.onclick = () => toggleSidebar(false);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        toggleSidebar(false);
        toggleHistory(false);
      }
    });
    const zeroTrackpad = document.getElementById('zeroTrackpad');
    let trackingCursor = false;
    let trackpadStartX = 0;
    let trackpadStartPosition = 0;
    let trackpadMoved = false;

    zeroTrackpad.addEventListener('pointerdown', event => {
      trackingCursor = true;
      trackpadMoved = false;
      trackpadStartX = event.clientX;
      trackpadStartPosition = cursorActive ? cursorPosition : value.length;
      zeroTrackpad.setPointerCapture?.(event.pointerId);
      activateCursor(trackpadStartPosition);
      event.preventDefault();
    });

    document.addEventListener('pointermove', event => {
      if (!trackingCursor) return;
      const distance = event.clientX - trackpadStartX;
      if (Math.abs(distance) > 4) trackpadMoved = true;
      const step = Math.max(1, Math.round(Math.abs(distance) / 24));
      const direction = distance < 0 ? -1 : 1;
      activateCursor(trackpadStartPosition + direction * step);
      event.preventDefault();
    }, { passive: false });

    function stopTrackpad() {
      trackingCursor = false;
    }

    document.addEventListener('pointerup', stopTrackpad);
    document.addEventListener('pointercancel', stopTrackpad);

    zeroTrackpad.addEventListener('click', event => {
      if (trackpadMoved) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);

    document.addEventListener('keydown', e => {
      if (/[0-9.()+\-*/]/.test(e.key)) {
        value += e.key.replace('*', '×').replace('/', '÷');
        render()
      }
      if (e.key === 'Enter') act('equals');
      if (e.key === 'Backspace') act('backspace');
      if (e.key === 'Escape') act('clear')
    });

  </script>
</body>

</html>
